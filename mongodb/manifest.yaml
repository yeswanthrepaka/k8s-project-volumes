apiVersion: v1
kind: Service

metadata:
  name: mongodb-headless
  namespace: roboshop
  labels:
    project: roboshop
    component: mongodb
    tier: database

spec:
  clusterIP: None
  selector:
    project: roboshop
    component: mongodb
    tier: database
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop
    component: mongodb
    tier: database

spec:
  serviceName: "mongodb-headless"
  replicas: 3
  selector:
    matchLabels:
      project: roboshop
      component: mongodb
      tier: database

  template:
    metadata:
      name: mongodb
      labels:
        project: roboshop
        component: mongodb
        tier: database
    spec:
      containers:
      - name: mongodb
        image: yeswanthrepaka/mongodb:1.3.0
        volumeMounts:
        - name: mongodb
          mountPath: /data/db

  volumeClaimTemplates:
  - metadata:
      name: mongodb
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs"
      resources:
        requests:
          storage: 2Gi    
---
apiVersion: v1
kind: Service

metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop
    component: mongodb
    tier: database

spec:
  selector:
    project: roboshop
    component: mongodb
    tier: database
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017